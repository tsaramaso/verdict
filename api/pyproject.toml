[project]
name = "verdict"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    # psycopg (v3), not psycopg2 — SQLAlchemy 2.0's recommended driver.
    # DATABASE_URL must use the postgresql+psycopg:// scheme to match.
    "psycopg[binary]>=3.1",
    "alembic>=1.19.0",
    "gunicorn>=26.0.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "ruff>=0.16.1",
]
