[project]
name = "verdict"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "psycopg[binary]>=3.1",
    "alembic>=1.19.0",
    "gunicorn>=26.0.0",
    "python-jose[cryptography]>=3.5.0",
    "loguru>=0.7.2",
    "python-json-logger>=2.0.7",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
ignore = ["B008"]
select = ["E", "F", "W"] 