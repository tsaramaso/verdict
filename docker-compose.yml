services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: verdict
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: verdict-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://verdict:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/verdict
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  ui:
    build: ./ui
    container_name: verdict-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      - api
    environment:
      VITE_API_URL: http://api:8000

volumes:
  db-data: